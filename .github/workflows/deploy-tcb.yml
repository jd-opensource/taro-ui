name: Publish root to TCB
# 当前文档已迁移至 GitHub Pages，此 workflow 暂时禁用
# 如需重新启用 TCB 部署，恢复原始触发条件即可
on:
  workflow_dispatch:

env:
  CI: true
  NODE_OPTIONS: --openssl-legacy-provider
jobs:
  publish:
    name: Publish Docs to TCB
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm start

      - name: Build taro-ui
        run: pnpm run build:ui

      - name: Build taro-ui-docs
        run: pnpm run build:doc

      - name: Deploy static to Tencent CloudBase
        id: deployStatic
        if: ${{ secrets.TCB_SECRET_ID != '' }}
        uses: TencentCloudBase/cloudbase-action@v1.1.1
        with:
          secretId: ${{ secrets.TCB_SECRET_ID }}
          secretKey: ${{ secrets.TCB_SECRET_KEY }}
          envId: ${{ secrets.TCB_TARO_UI_ENV_ID }}
          staticSrcPath: docs/dist
