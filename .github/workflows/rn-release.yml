on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  taro_release_job:
    runs-on: ubuntu-latest
    name: Taro Bundle Release
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Cache node_modules Folder
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node_modules
          restore-keys: ${{ runner.os }}-node_modules

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: install
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Release Taro React Native bundle
        uses: zhiqingchen/taro-react-native-release@v1
        with:
          workingdirectory: ./examples/demo-rn
          token: ${{ secrets.GITHUB_TOKEN }}
          appname: Taro-UI-Demo
          logo: https://pic5.58cdn.com.cn/nowater/fangfe/n_v25a185c1657984016926f26af591912c4.jpg
      - name: Upload Qr Image
        uses: actions/upload-artifact@v4
        with:
          name: bundle-qr-code
          path: |
            examples/demo-rn/release/qrcode/ios.png
            examples/demo-rn/release/qrcode/android.png
